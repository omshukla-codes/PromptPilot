<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Prompt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Edit Prompt
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Prompt Title
                </label>

                <input type="text"
                       name="title"
                       class="form-control"
                       value="{{ prompt.title }}"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Prompt Text
                </label>

                <textarea name="prompt_text"
                          class="form-control"
                          rows="6"
                          required>{{ prompt.prompt_text }}</textarea>

            </div>

            <button class="btn btn-primary">
                Update Prompt
            </button>

        </form>

    </div>

</div>

</body>
</html>
