<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | PromptPilot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<!-- Navigation -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">

    <div class="container">

        <a class="navbar-brand fw-bold fs-2"
           href="/dashboard">

            PromptPilot

        </a>

        <div class="d-flex align-items-center">

            <a href="/my-prompts"
               class="btn btn-light fw-semibold text-dark me-2 px-4">

                My Prompts

            </a>

            <a href="/logout"
               class="btn btn-danger fw-semibold px-4">

                Logout

            </a>

        </div>

    </div>

</nav>

<!-- Main Dashboard -->

<div class="container py-5">

    <!-- Welcome Section -->

    <div class="mb-5">

        <h1 class="display-4 fw-bold mb-3">

            Welcome back,
            <span class="text-primary">

                {{ session['user_name'] }}

            </span>

        </h1>

        <p class="text-muted fs-5">

            Monitor your prompts, manage reviews and improve prompt quality efficiently.

        </p>

    </div>

    <!-- Statistics Cards -->

    <div class="row g-4">

        <!-- Total Prompts -->

        <div class="col-lg-4 col-md-6">

            <div class="card border-0 shadow-sm dashboard-card h-100">

                <div class="card-body p-4">

                    <h6 class="text-uppercase text-muted mb-3">

                        Total Prompts

                    </h6>

                    <h1 class="fw-bold display-5">

                        {{ total_prompts }}

                    </h1>

                </div>

            </div>

        </div>

        <!-- Pending Reviews -->

        <div class="col-lg-4 col-md-6">

            <div class="card border-0 shadow-sm dashboard-card bg-warning-subtle h-100">

                <div class="card-body p-4">

                    <h6 class="text-uppercase text-muted mb-3">

                        Pending Reviews

                    </h6>

                    <h1 class="fw-bold display-5">

                        {{ pending_prompts }}

                    </h1>

                </div>

            </div>

        </div>

        <!-- Reviewed Prompts -->

        <div class="col-lg-4 col-md-12">

            <div class="card border-0 shadow-sm dashboard-card bg-success-subtle h-100">

                <div class="card-body p-4">

                    <h6 class="text-uppercase text-muted mb-3">

                        Reviewed Prompts

                    </h6>

                    <h1 class="fw-bold display-5">

                        {{ reviewed_prompts }}

                    </h1>

                </div>

            </div>

        </div>

    </div>

    <!-- Quick Actions -->

    <div class="mt-5 d-flex flex-wrap gap-3">

        <a href="/submit-prompt"
           class="btn btn-dark btn-lg px-4">

            Submit Prompt

        </a>

        <a href="/my-prompts"
           class="btn btn-outline-dark btn-lg px-4">

            View Prompts

        </a>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
