<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - PromptPilot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <span class="navbar-brand">
            PromptPilot
        </span>

        <div>

            <a href="/my-prompts"
                class="btn btn-outline-light me-2">

                My Prompts

            </a>

            <a href="/logout"
                class="btn btn-danger">

                Logout

            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <h1>
        Welcome, {{ session['user_name'] }}
    </h1>

    <p class="text-muted mb-5">
        Manage and review AI prompts efficiently.
    </p>

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card dashboard-card">

                <h5>Total Prompts</h5>

                <h2>
                    {{ total_prompts }}
                </h2>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card dashboard-card bg-warning-subtle">

                <h5>Pending Reviews</h5>

                <h2>
                    {{ pending_prompts }}
                </h2>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card dashboard-card bg-success-subtle">

                <h5>Reviewed Prompts</h5>

                <h2>
                    {{ reviewed_prompts }}
                </h2>

            </div>

        </div>

    </div>

    <div class="mt-4">

        <a href="/submit-prompt"
            class="btn btn-dark me-3">

            Submit Prompt

        </a>

        <a href="/my-prompts"
            class="btn btn-outline-dark">

            View Prompts

        </a>

    </div>

</div>

</body>
</html>
