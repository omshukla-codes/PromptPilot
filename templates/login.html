<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | PromptPilot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark shadow-sm py-3">

    <div class="container">

        <a href="/"
           class="navbar-brand fw-bold fs-2 text-decoration-none">

            PromptPilot

        </a>

    </div>

</nav>

<!-- Login Section -->

<div class="container py-5">

    <div class="row justify-content-center align-items-center">

        <div class="col-lg-5 col-md-7">

            <div class="auth-card shadow-lg border-0">

                <div class="card-body p-5 bg-white rounded-4">

                    <!-- Heading -->

                    <div class="text-center mb-4">

                        <h1 class="fw-bold mb-3">

                            Welcome Back

                        </h1>

                        <p class="text-muted">

                            Login to manage your AI prompts and reviews.

                        </p>

                    </div>

                    <!-- Flash Messages -->

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div class="alert alert-{{ category }} alert-dismissible fade show">

                                    {{ message }}

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="alert">
                                    </button>

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}

                    <!-- Login Form -->

                    <form method="POST">

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Email Address

                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your email"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Password

                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your password"
                                   required>

                        </div>

                        <button class="btn btn-primary btn-lg w-100">

                            Login

                        </button>

                    </form>

                    <!-- Bottom Links -->

                    <div class="text-center mt-4">

                        <p class="text-muted mb-2">

                            Don't have an account?

                        </p>

                        <a href="/register"
                           class="text-decoration-none fw-semibold">

                            Create Account

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
