<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Prompt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <h1 class="mb-4">
                    Submit Prompt
                </h1>

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">
                            Prompt Title
                        </label>

                        <input type="text"
                            name="title"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Prompt Content
                        </label>

                        <textarea name="prompt_text"
                            rows="7"
                            class="form-control"
                            required></textarea>

                    </div>

                    <button class="btn btn-primary">

                        Submit Prompt

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
